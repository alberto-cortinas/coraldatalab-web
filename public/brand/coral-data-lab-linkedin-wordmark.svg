<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Coral Data Lab</title>
  <desc id="desc">Símbolo circular coral sobre el nombre Coral Data Lab compuesto en dos líneas.</desc>
  <style>
    @font-face {
      font-family: "Inter CDL";
      font-style: normal;
      font-weight: 500;
      src: url("../fonts/inter-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "Inter CDL";
      font-style: normal;
      font-weight: 600;
      src: url("../fonts/inter-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Inter CDL";
      font-style: normal;
      font-weight: 700;
      src: url("../fonts/inter-700.ttf") format("truetype");
    }
  </style>
  <rect width="800" height="800" fill="#FFFFFF"/>

  <g text-anchor="middle" font-family="'Inter CDL', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="400" y="585" fill="#D8432B" font-size="86" font-weight="700" textLength="346" lengthAdjust="spacing">CORAL</text>
    <text x="400" y="654" fill="#15181C" font-size="68" font-weight="600" textLength="368" lengthAdjust="spacing">DATALAB</text>
  </g>

  <circle cx="400" cy="302" r="168" fill="#D8432B"/>
  <circle cx="448" cy="254" r="52" fill="#FFFFFF"/>
</svg>
